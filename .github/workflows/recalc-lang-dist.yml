name: 언어 분포 재집계 (온디맨드)
# 전체 active 게임의 RAW 리뷰 언어 분포를 재계산합니다.
# language_distribution JSON / top_languages / collected_reviews_count 갱신.

on:
  workflow_dispatch:

jobs:
  recalc-lang-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 언어 분포 재집계
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
        run: |
          cd backend
          python tools/recalc_lang_dist.py
