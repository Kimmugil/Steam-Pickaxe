name: 동접 수집 (매시간)
# 진행 중인 게임의 현재 접속자 수를 한 줄씩 쌓습니다.
# GitHub는 붐비는 시간(특히 정각 근처)의 예약 실행을 자주 건너뜁니다. 실제로 "매시 5분" 예약이 평균 5시간에 한 번만 돌았습니다.
# 그래서 붐비지 않는 분(23분·53분)에 한 시간 두 번 예약해, 일부가 건너뛰어져도 한 시간에 한 번 안팎은 기록되게 합니다.

on:
  schedule:
    - cron: "23,53 * * * *"    # 매시 23분·53분
  workflow_dispatch:

# 같은 작업이 겹쳐 돌지 않게 하는 일은 프로그램이 DB 잠금으로 합니다. (backend/common.py try_lock)
permissions:
  contents: read

jobs:
  ccu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: pip install -r backend/requirements.txt

      - name: 동접 수집
        working-directory: backend
        run: python collect_ccu.py
