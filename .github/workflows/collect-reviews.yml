name: 리뷰 수집 (매일)
# 하루 한 번: 게임마다 새 리뷰가 얼마나 늘었는지 점검하고, 수집할 때가 된 게임만 받습니다.
# 처음 몇 번은 과거 리뷰의 플레이타임을 채우느라 오래 걸리며, 시간이 모자라면 저장된 위치에서 다음 날 이어받습니다.

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 한국 시간 05:00
  workflow_dispatch:
    inputs:
      appid:
        description: "특정 게임만 (AppID, 비우면 때가 된 게임 전체)"
        required: false
      force:
        description: "때가 아니어도 모든 게임 수집"
        type: boolean
        default: false

# 같은 작업이 겹쳐 돌지 않게 하는 일은 프로그램이 DB 잠금으로 합니다. (backend/common.py try_lock)
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # GitHub 한도(6시간) 안쪽
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 필요한 프로그램 설치
        run: pip install -r backend/requirements.txt

      - name: 리뷰 수집
        working-directory: backend
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.appid }}" ]; then ARGS="$ARGS --appid ${{ github.event.inputs.appid }}"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python collect.py run --budget-min 320 $ARGS

      - name: 실패 알림 (알림 주소를 등록한 경우에만)
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H "Content-Type: application/json"             -d "{\"content\":\"[Steam Pickaxe] ${{ github.workflow }} 실패 → ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"             "$ALERT_WEBHOOK_URL" || true
