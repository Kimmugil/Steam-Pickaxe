name: 평가 급변 감지 (주간)

on:
  schedule:
    - cron: "0 2 * * 1"   # 매주 월요일 02:00 UTC (KST 11:00)
  workflow_dispatch:
    inputs:
      appid:
        description: "특정 게임 AppID (비워두면 전체 게임 처리)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run (실제 저장 없이 미리보기)"
        type: boolean
        default: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 평가 급변 감지 + AI 분석
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APPID: ${{ github.event.inputs.appid }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          cd backend
          python main_detect.py
