name: 분석 (매일)
# 지표 계산 → 급변·업데이트 영향 감지 → 빠지거나 낡은 AI 분석만 이어서 처리(자동 복구) → 브리핑 만들기

on:
  schedule:
    - cron: "30 21 * * *"  # 매일 한국 시간 06:30
  workflow_dispatch:
    inputs:
      max_calls:
        description: "이번 실행에서 AI를 부를 최대 횟수"
        required: false
        default: "150"

concurrency:
  group: analyze
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 필요한 프로그램 설치
        run: pip install -r backend/requirements.txt

      - name: 지표·급변·업데이트 영향 계산
        working-directory: backend
        run: python run_calc.py

      - name: AI 분석 (빠진 것만 이어서)
        working-directory: backend
        run: python analyze.py run --max-calls ${{ github.event.inputs.max_calls || 150 }}

      - name: 브리핑 만들기
        working-directory: backend
        run: python analyze.py brief

      - name: 실패 알림 (알림 주소를 등록한 경우에만)
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H "Content-Type: application/json"             -d "{\"content\":\"[Steam Pickaxe] ${{ github.workflow }} 실패 → ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"             "$ALERT_WEBHOOK_URL" || true
