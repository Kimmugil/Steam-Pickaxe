name: AI 분석 (월 단위)

on:
  schedule:
    - cron: "0 0 1 * *"   # 매월 1일 00:00 UTC — 전월 최종 분석 확정
  workflow_dispatch:
    inputs:
      appid:
        description: '특정 게임 AppID (미입력 시 전체)'
        required: false
      year_month:
        description: '분석할 월 (YYYY-MM, 미입력 시 현재 월)'
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: AI 분석 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APPID: ${{ github.event.inputs.appid }}
          TARGET_YEAR_MONTH: ${{ github.event.inputs.year_month }}
        run: |
          cd backend
          python main_analyze.py
