name: 플레이타임 통계 재계산 (온디맨드)
# RAW 리뷰의 playtime_at_review를 P25/P75 퍼센타일로 구간 분류하여
# master sheet의 playtime_stats / playtime_stats_date 컬럼을 갱신합니다.

on:
  workflow_dispatch:
    inputs:
      appid:
        description: '특정 게임 AppID (비워두면 전체 active 게임 처리)'
        required: false
        default: ''

jobs:
  calc-playtime-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 플레이타임 통계 계산
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
        run: |
          cd backend
          python tools/calc_playtime_stats.py ${{ github.event.inputs.appid }}
