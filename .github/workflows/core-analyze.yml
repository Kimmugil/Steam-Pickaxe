name: 종합 분석 (AI 브리핑·CCU·언어·추이)
# 관리자 패널 [종합 분석] 버튼이 repository_dispatch(core-analyze-game)를 보내면
# 이벤트 수집·월간 분석 없이 4개 종합 분석만 즉시 실행합니다:
#   - AI 브리핑 (ai_briefing)
#   - CCU 피크타임 분석 (ccu_peaktime_comment)
#   - 평가 추이 종합 진단 (sentiment_trend_comment)
#   - 언어권 교차 분석 (language_cross_comment)

on:
  repository_dispatch:
    types: [core-analyze-game]

jobs:
  core-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 종합 분석 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APPID: ${{ github.event.client_payload.appid }}
          CORE_ONLY: "true"
        run: |
          cd backend
          python main_analyze.py
