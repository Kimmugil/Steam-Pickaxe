name: top_reviews 재선별

on:
  workflow_dispatch:
    inputs:
      appid:
        description: "특정 게임 AppID (비워두면 전체 게임 처리)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run (실제 저장 없이 미리보기)"
        type: boolean
        default: false

jobs:
  reselect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: top_reviews 재선별
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
        run: |
          cd backend
          ARGS=""
          if [ -n "${{ github.event.inputs.appid }}" ]; then
            ARGS="$ARGS --appid ${{ github.event.inputs.appid }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python tools/reselect_top_reviews.py $ARGS
