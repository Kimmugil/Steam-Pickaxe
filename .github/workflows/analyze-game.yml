name: 게임별 타임라인 AI 분석 (온디맨드)
# 관리자 패널 버튼으로 특정 게임의 AI 분석을 즉시 실행합니다.
#   year_month 미입력 → 전체 타임라인 재분석 + 평가 급변 감지
#   year_month 입력   → 해당 월만 선택 재분석 (급변 감지 생략)

on:
  workflow_dispatch:
    inputs:
      appid:
        description: '처리할 게임 AppID'
        required: true
      year_month:
        description: '특정 월만 분석 (YYYY-MM). 비워두면 전체 타임라인 재분석.'
        required: false
        default: ''
      early_launch_only:
        description: '출시 초기 주간 버킷만 재분석 (true/false)'
        required: false
        default: 'false'

jobs:
  analyze-game:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: AI 분석 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APPID: ${{ github.event.inputs.appid }}
          TARGET_YEAR_MONTH: ${{ github.event.inputs.year_month }}
          EARLY_LAUNCH_ONLY: ${{ github.event.inputs.early_launch_only }}
        run: |
          cd backend
          python main_analyze.py

      - name: 평가 급변 감지 (전체 타임라인 분석 시에만)
        if: github.event.inputs.year_month == '' && github.event.inputs.early_launch_only != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTER_SPREADSHEET_ID: ${{ secrets.MASTER_SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_APPID: ${{ github.event.inputs.appid }}
        run: |
          cd backend
          python main_detect.py
